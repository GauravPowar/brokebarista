<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box }
    :root { --amber: #e8a83e; --caramel: #c47d2a; --cream: #f5efe0; --c1: #1a0a00 }
    body { font-family: 'DM Sans', sans-serif; background: var(--c1); color: var(--cream); overflow: hidden; height: 100vh; width: 100vw; user-select: none }
    #deck { width: 100%; height: 100%; position: relative }
    .slide { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity .5s, transform .5s; transform: translateY(40px); padding: 2rem; text-align: center; overflow-y: auto; overflow-x: hidden }
    .slide.active { opacity: 1; pointer-events: all; transform: translateY(0) }
    .slide.out { opacity: 0; transform: translateY(-40px) }
    .s0  { background: radial-gradient(ellipse at 30% 40%, #1a2d1a, #040a04 70%) }
    .s1  { background: radial-gradient(ellipse at 70% 30%, #1a1a3d, #040408 70%) }
    .s2  { background: radial-gradient(ellipse at 50% 60%, #2d1a00, #0a0400 70%) }
    .s3  { background: radial-gradient(ellipse at 20% 50%, #001a2d, #000508 70%) }
    .s4  { background: radial-gradient(ellipse at 80% 40%, #1a001a, #050005 70%) }
    .s5  { background: radial-gradient(ellipse at 50% 50%, #001a1a, #000503 70%) }
    .s6  { background: radial-gradient(ellipse at 30% 60%, #1a1a00, #050500 70%) }
    .s7  { background: radial-gradient(ellipse at 60% 40%, #2d0a00, #0d0300 70%) }
    .s8  { background: radial-gradient(ellipse at 50% 50%, #001a0a, #000503 70%) }
    .s9  { background: radial-gradient(ellipse at 40% 30%, #0a001a, #020005 70%) }
    .s10 { background: radial-gradient(ellipse at 60% 50%, #1a0a00, #050200 70%) }
    .s11 { background: radial-gradient(ellipse at 40% 50%, #001a1a, #000505 70%) }
    .s12 { background: radial-gradient(ellipse at 50% 40%, #0a1a00, #020500 70%) }
    .particle { position: absolute; border-radius: 50%; pointer-events: none; animation: float linear infinite; opacity: .15 }
    @keyframes float { 0% { transform: translateY(100vh) rotate(0deg) } 100% { transform: translateY(-20px) rotate(720deg) } }
    .label { font-size: .75rem; letter-spacing: .2em; text-transform: uppercase; opacity: .55; margin-bottom: 1rem; font-weight: 600 }
    .bignum { font-size: clamp(4rem, 20vw, 9rem); font-weight: 900; line-height: 1; background: linear-gradient(135deg, var(--amber), var(--caramel), #fff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; animation: pop .6s cubic-bezier(.175,.885,.32,1.275) both }
    @keyframes pop { from { transform: scale(.5); opacity: 0 } to { transform: scale(1); opacity: 1 } }
    .headline { font-family: 'DM Serif Display', serif; font-size: clamp(1.4rem, 5vw, 2.4rem); line-height: 1.2; margin: .5rem 0 1rem }
    .sub { font-size: 1rem; opacity: .65; max-width: 520px; line-height: 1.6 }
    .hi { color: var(--amber); font-weight: 700; -webkit-text-fill-color: var(--amber) }
    .pill { display: inline-block; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15); border-radius: 999px; padding: .4rem 1.2rem; font-size: .9rem; margin: .3rem; backdrop-filter: blur(8px) }
    .bar-item { display: flex; align-items: center; gap: 1rem; margin: .4rem 0; width: min(420px, 90vw) }
    .bname { font-size: .85rem; width: 130px; text-align: right; flex-shrink: 0; line-height: 1.2 }
    .btrack { flex: 1; background: rgba(255,255,255,.08); border-radius: 4px; height: 10px; overflow: hidden }
    .bfill { height: 100%; border-radius: 4px }
    .bval { font-size: .8rem; opacity: .6; width: 30px; flex-shrink: 0 }
    .tag { display: inline-block; font-size: .75rem; padding: .3rem .8rem; border-radius: 999px; margin: .2rem; font-weight: 600 }
    .moment-item { display: flex; align-items: flex-start; gap: .9rem; text-align: left; margin: .6rem 0; max-width: 480px; width: 90vw }
    .mdot { width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: .65rem; border: 0.5px solid }
    .mdot-good { background: rgba(90,158,114,.15); border-color: rgba(90,158,114,.4); color: #7ac494 }
    .mdot-bad { background: rgba(192,80,58,.15); border-color: rgba(192,80,58,.4); color: #e06050 }
    .mbody .date { font-size: .68rem; opacity: .4; text-transform: uppercase; letter-spacing: .08em; margin-bottom: .15rem }
    .mbody .note { font-family: 'DM Serif Display', serif; font-size: 1.05rem; font-style: italic; line-height: 1.25 }
    .mbody .note.good { color: #7ac494 }
    .mbody .note.bad { color: #e06050 }
    .mbody .detail { font-size: .75rem; opacity: .5; margin-top: .2rem; line-height: 1.5 }
    .chart-container { width: min(480px, 90vw); height: 220px; position: relative }
    .month-bar { display: flex; align-items: flex-end; gap: 1.5rem; margin-top: 1.5rem }
    .month-col { display: flex; flex-direction: column; align-items: center; gap: .4rem }
    .month-fill { width: 56px; border-radius: 6px 6px 0 0 }
    .month-label { font-size: .75rem; opacity: .5 }
    .month-val { font-size: 1.1rem; font-weight: 800 }
    #progress { position: fixed; top: 0; left: 0; height: 3px; background: var(--amber); transition: width .4s; z-index: 9999 }
    #backBtn { position: fixed; top: 1.1rem; left: 1rem; z-index: 999; background: rgba(0,0,0,.4); border: 1px solid rgba(255,255,255,.12); border-radius: 999px; padding: .35rem .9rem; color: var(--cream); font-family: 'DM Sans', sans-serif; font-size: .75rem; letter-spacing: .05em; text-decoration: none; backdrop-filter: blur(8px); transition: background .2s }
    #backBtn:hover { background: rgba(255,255,255,.1) }
    #dots { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); display: flex; gap: .5rem; z-index: 999 }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.25); cursor: pointer; transition: all .3s }
    .dot.active { background: var(--amber); transform: scale(1.4) }
    #navL, #navR { position: fixed; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,.06); border: none; color: var(--cream); font-size: 1.5rem; cursor: pointer; z-index: 999; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: background .2s }
    #navL:hover, #navR:hover { background: rgba(255,255,255,.15) }
    #navL { left: 1rem }
    #navR { right: 1rem }
    .coffee-cup { font-size: 5rem; animation: bounce 2s ease-in-out infinite }
    @keyframes bounce { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-12px) } }
    .steam { position: absolute; bottom: 44%; left: 50%; width: 3px; background: rgba(255,255,255,.12); border-radius: 2px; animation: steam 2s ease-in-out infinite; transform-origin: bottom center }
    @keyframes steam { 0% { height: 0; opacity: .2; transform: translateX(-50%) } 50% { height: 60px; opacity: .5; transform: translateX(-50%) scaleX(1.5) rotate(4deg) } 100% { height: 0; opacity: 0; transform: translateX(-50%) } }
    .glow { text-shadow: 0 0 40px var(--amber), 0 0 80px rgba(232,168,62,.4); animation: pulse 2s ease-in-out infinite }
    @keyframes pulse { 0%,100% { text-shadow: 0 0 40px var(--amber), 0 0 80px rgba(232,168,62,.3) } 50% { text-shadow: 0 0 60px var(--amber), 0 0 120px rgba(232,168,62,.6) } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(20px) } to { opacity: 1; transform: translateY(0) } }
    .fu { animation: fadeUp .6s both }
    .d1 { animation-delay: .15s } .d2 { animation-delay: .3s } .d3 { animation-delay: .45s } .d4 { animation-delay: .6s } .d5 { animation-delay: .75s }
  </style>

    const SLIDES=[
      {cls:'s0',html:`<div class="steam" style="margin-left:-8px"></div><div class="steam" style="margin-left:8px;animation-delay:.7s"></div><div class="coffee-cup">&#9749;</div><div class="label fu d1">Quarterly Recap</div><div class="headline fu d2" style="font-size:clamp(2rem,8vw,3.8rem)">Q3 <span style="color:var(--amber)">2026</span></div><div class="sub fu d3">123 brews across 3 months.<br>July &middot; August &middot; September &mdash; the quarter you <em>found your machine</em>.</div>`},
      {cls:'s1',html:`<div class="label fu">Total Sessions</div><div class="bignum fu d1">123</div><div class="headline fu d2">cups in <em>92 days</em></div><div class="sub fu d3">Brewed on <span class="hi">85 out of 92 days</span> &mdash; averaging 1.3 brews a day.<br>32 perfect shots. 8 different beans. First-ever Robusta. Grinder locked.</div><div style="margin-top:1rem;display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center" class="fu d4"><div class="pill">&#11088; 32 five-stars</div><div class="pill">&#128202; 3.7&#9733; avg</div><div class="pill">&#129752; 8 beans</div><div class="pill">&#127975; First Robusta</div></div>`},
      {cls:'s2',html:`<div class="label fu">Month by Month</div><div class="headline fu d1">September was the <span class="hi">busiest month</span></div><div class="month-bar fu d2"><div class="month-col"><div class="month-val">31</div><div class="month-fill" style="height:93px;background:${AMBER}"></div><div class="month-label">July</div></div><div class="month-col"><div class="month-val">45</div><div class="month-fill" style="height:135px;background:${GREEN}"></div><div class="month-label">August</div></div><div class="month-col"><div class="month-val">47</div><div class="month-fill" style="height:141px;background:${PURPLE}"></div><div class="month-label">September</div></div></div><div class="sub fu d3" style="margin-top:1.2rem">24 active days &rarr; <span class="hi">31/31</span> &rarr; <span class="hi">30/30</span><br>Two perfect months back-to-back.</div>`},
      {cls:'s3',html:`<div class="label fu">Brewer Lineup</div><div class="headline fu d1"><span class="hi">116</span> espresso-style &middot; <span class="hi">21</span> filter</div><div style="margin-top:1.5rem" class="fu d2"><div class="bar-item"><div class="bname">Espresso</div><div class="btrack"><div class="bfill" style="width:100%;background:${AMBER}"></div></div><div class="bval">87&times;</div></div><div class="bar-item"><div class="bname">Kompresso</div><div class="btrack"><div class="bfill" style="width:14%;background:${PURPLE}"></div></div><div class="bval">12&times;</div></div><div class="bar-item"><div class="bname">V60</div><div class="btrack"><div class="bfill" style="width:24%;background:${GREEN}"></div></div><div class="bval">21&times;</div></div><div class="bar-item"><div class="bname">KaldiPress</div><div class="btrack"><div class="bfill" style="width:3%;background:#27ae60"></div></div><div class="bval">3&times;</div></div></div><div class="chart-container fu d3" style="margin-top:1rem;height:180px"><canvas id="brewerChart"></canvas></div><div class="sub fu d4" style="margin-top:.5rem"><span style="color:${AMBER}">&#9632;</span> Espresso <span style="color:${PURPLE}">&#9632;</span> Kompresso <span style="color:${GREEN}">&#9632;</span> V60 &middot; per month</div>`},
      {cls:'s4',html:`<div class="label fu">The Machine Saga &mdash; Q3 Arc</div><div class="headline fu d1">From Kompresso winter to <span class="hi">Dedica dominance</span></div><div style="margin-top:1.2rem;display:flex;flex-direction:column;gap:.8rem;align-items:center" class="fu d2"><div style="background:rgba(142,68,173,.08);border:1px solid rgba(142,68,173,.2);border-radius:12px;padding:.9rem 1.4rem;max-width:400px;text-align:left;width:90vw"><div style="font-size:.7rem;opacity:.4;text-transform:uppercase;letter-spacing:.1em;margin-bottom:.3rem">Jul 1&ndash;21 &middot; The long haul</div><div style="font-family:'DM Serif Display',serif;font-size:1.05rem;color:#8e44ad">12 Kompresso + 7 V60. Dedica still out.</div><div style="font-size:.78rem;opacity:.5;margin-top:.2rem">Kompresso dialled in at 30 clicks. Held the fort. Not a complaint.</div></div><div style="background:rgba(90,158,114,.08);border:1px solid rgba(90,158,114,.2);border-radius:12px;padding:.9rem 1.4rem;max-width:400px;text-align:left;width:90vw"><div style="font-size:.7rem;opacity:.4;text-transform:uppercase;letter-spacing:.1em;margin-bottom:.3rem">Jul 22 &middot; The return</div><div style="font-family:'DM Serif Display',serif;font-size:1.05rem;color:#7ac494">Dedica back. 32 clicks locked by Jul 30. &#9749;</div><div style="font-size:.78rem;opacity:.5;margin-top:.2rem">5 dialling sessions. Chaos &rarr; locked. "Dialled in. For now :)"</div></div><div style="background:rgba(232,168,62,.06);border:1px solid rgba(232,168,62,.15);border-radius:12px;padding:.9rem 1.4rem;max-width:400px;text-align:left;width:90vw"><div style="font-size:.7rem;opacity:.4;text-transform:uppercase;letter-spacing:.1em;margin-bottom:.3rem">Aug &rarr; Sep &middot; Full control</div><div style="font-family:'DM Serif Display',serif;font-size:1.05rem;color:var(--amber)">29&ndash;33 clicks. Five-star runs. Two perfect months.</div><div style="font-size:.78rem;opacity:.5;margin-top:.2rem">Aug 25&ndash;30: five 5&#9733; days in a row. Sep: Aranya Gold locked at 33 clicks on shot 1.</div></div></div>`},
      {cls:'s5',html:`<div class="label fu">Bean Rotation</div><div class="headline fu d1"><span class="hi">8 beans</span> &mdash; Daily Driver was king</div><div style="margin-top:1.2rem" class="fu d2"><div class="bar-item"><div class="bname" style="font-size:.72rem">Daily Driver</div><div class="btrack"><div class="bfill" style="width:100%;background:${AMBER}"></div></div><div class="bval">77&times;</div></div><div class="bar-item"><div class="bname" style="font-size:.72rem">Excelsa</div><div class="btrack"><div class="bfill" style="width:13%;background:${PURPLE}"></div></div><div class="bval">10&times;</div></div><div class="bar-item"><div class="bname" style="font-size:.72rem">SKIA Red Honey</div><div class="btrack"><div class="bfill" style="width:12%;background:${RED}"></div></div><div class="bval">9&times;</div></div><div class="bar-item"><div class="bname" style="font-size:.72rem">Raxidi Lobo</div><div class="btrack"><div class="bfill" style="width:9%;background:#27ae60"></div></div><div class="bval">7&times;</div></div><div class="bar-item"><div class="bname" style="font-size:.72rem">Java Trench</div><div class="btrack"><div class="bfill" style="width:9%;background:${GREEN}"></div></div><div class="bval">7&times;</div></div><div class="bar-item"><div class="bname" style="font-size:.72rem">Candy Haze</div><div class="btrack"><div class="bfill" style="width:8%;background:${BLUE}"></div></div><div class="bval">6&times;</div></div><div class="bar-item"><div class="bname" style="font-size:.72rem">Brewer's Tribute</div><div class="btrack"><div class="bfill" style="width:5%;background:#16a085"></div></div><div class="bval">4&times;</div></div><div class="bar-item"><div class="bname" style="font-size:.72rem">Aranya Gold &#127381;</div><div class="btrack"><div class="bfill" style="width:5%;background:#d35400"></div></div><div class="bval">4&times;</div></div></div><div class="sub fu d3" style="margin-top:.6rem;font-size:.85rem">Stockholm Roasters Daily Driver: 3 bags       {cls:'s6',html:`<div class="label fu">New Arrivals This Quarter</div><div class="headline fu d1">Three debuts that <span class="hi">changed the palette</span></div><div style="margin-top:1rem;display:flex;flex-direction:column;gap:.7rem;align-items:center" class="fu d2"><div style="background:rgba(192,80,58,.08);border:1px solid rgba(192,80,58,.2);border-radius:12px;padding:.75rem 1.2rem;max-width:400px;text-align:left;width:90vw"><div style="font-size:.68rem;opacity:.4;text-transform:uppercase;letter-spacing:.09em;margin-bottom:.2rem">Jul 29 &middot; Debut</div><div style="font-family:'DM Serif Display',serif;font-size:1rem;color:${RED}">Ruckus Java Trench</div><div style="font-size:.75rem;opacity:.5;margin-top:.15rem">First shot: instant &#9733;&#9733;&#9733;&#9733;. V60 hero of August. Best: Strawberry, Peach, Sweet Aromatics at 100 clicks &#11088;&#11088;&#11088;&#11088;&#11088;</div></div><div style="background:rgba(192,80,58,.08);border:1px solid rgba(192,80,58,.2);border-radius:12px;padding:.75rem 1.2rem;max-width:400px;text-align:left;width:90vw"><div style="font-size:.68rem;opacity:.4;text-transform:uppercase;letter-spacing:.09em;margin-bottom:.2rem">Aug 29 &middot; Debut</div><div style="font-family:'DM Serif Display',serif;font-size:1rem;color:#e07868">Monsoon Excelsa &mdash; wine in a cup</div><div style="font-size:.75rem;opacity:.5;margin-top:.15rem">"The aroma is lovely. Wine all over the room." Still dialling Sep 30. 10 shots, still chaotic, still beautiful.</div></div><div style="background:rgba(39,174,96,.08);border:1px solid rgba(39,174,96,.2);border-radius:12px;padding:.75rem 1.2rem;max-width:400px;text-align:left;width:90vw"><div style="font-size:.68rem;opacity:.4;text-transform:uppercase;letter-spacing:.09em;margin-bottom:.2rem">Sep 26 &middot; Debut</div><div style="font-family:'DM Serif Display',serif;font-size:1rem;color:#7ac494">Aranya Gold (Hunkal Estate) &mdash; instant confidence</div><div style="font-size:.75rem;opacity:.5;margin-top:.15rem">33 clicks on shot 1. 4&#9733;&rarr;4&#9733;&rarr;4&#9733;&rarr;5&#9733; in first four sessions. Washed, clean, total opposite of Excelsa chaos.</div></div></div>`},
      {cls:'s7',html:`<div class="label fu">Milestone</div><div class="headline fu d1">First ever <span class="hi">Robusta</span> brewed this quarter</div><div style="margin-top:1.2rem;display:flex;flex-direction:column;gap:.8rem;align-items:center" class="fu d2"><div style="background:rgba(192,80,58,.08);border:1px solid rgba(192,80,58,.2);border-radius:12px;padding:.9rem 1.4rem;max-width:420px;text-align:left;width:90vw"><div style="font-size:.7rem;opacity:.4;text-transform:uppercase;letter-spacing:.1em;margin-bottom:.3rem">Sep 8&ndash;24 &middot; SKIA Red Honey (125g)</div><div style="font-family:'DM Serif Display',serif;font-size:1.1rem;color:${RED}">&#9889; A whole new machine</div><div style="font-size:.78rem;opacity:.5;margin-top:.4rem">Needed 35 clicks vs 31 for Arabica. Coconut, Raisin, Apple, Peanuts &mdash; nothing like anything before.<br><br>9 shots across 17 days. Finished Sep 24. First pure Robusta in the logbook.</div></div><div style="display:flex;gap:1rem;flex-wrap:wrap;justify-content:center" class="fu d3"><div class="pill">&#127975; First Robusta</div><div class="pill">&#8377;200 split w/ @16clicks</div><div class="pill">35 clicks K6</div><div class="pill">9 shots</div></div></div>`},
      {cls:'s8',html:`<div class="label fu">Your Palate This Quarter</div><div class="headline fu d1"><span class="hi">Dark Chocolate</span> &amp; <span class="hi">Strawberry</span> ruled Q3</div><div style="margin-top:1.2rem" class="fu d2"><span class="tag" style="background:#c47d2a22;border:1px solid #c47d2a55;color:#c47d2a">Dark Chocolate &times;6 &#11088;</span><span class="tag" style="background:#c0392b22;border:1px solid #c0392b55;color:#e07868">Strawberry &times;4 &#11088;</span><span class="tag" style="background:#e8a83e22;border:1px solid #e8a83e55;color:#e8a83e">Sweet Aromatics &times;4</span><span class="tag" style="background:#27ae6022;border:1px solid #27ae6055;color:#7ac494">Overall Sweet &times;3</span><span class="tag" style="background:#2980b922;border:1px solid #2980b955;color:#7ab4d6">Cocoa &times;3</span><span class="tag" style="background:#8e44ad22;border:1px solid #8e44ad55;color:#b07fd6">Raisin &times;2 &#11088;</span><span class="tag" style="background:#16a08522;border:1px solid #16a08555;color:#7ac494">Apple &times;2 &#11088;</span><span class="tag" style="background:#27ae6022;border:1px solid #27ae6055;color:#7ac494">Vanilla &times;2</span><span class="tag" style="background:#2980b922;border:1px solid #2980b955;color:#7ab4d6">Caramelized &times;2</span><span class="tag" style="background:#16a08522;border:1px solid #16a08555;color:#7ac494">Coconut &times;2</span><span class="tag" style="background:#c0392b22;border:1px solid #c0392b55;color:#e07868">Peach &times;1 &#11088;</span><span class="tag" style="background:#16a08522;border:1px solid #16a08555;color:#7ac494">Orange &times;1 &#11088;</span><span class="tag" style="background:#e8a83e22;border:1px solid #e8a83e55;color:#e8a83e">Hazelnut &times;1</span></div><div class="sub fu d3" style="margin-top:.6rem;font-size:.8rem;opacity:.4">+ Maple Syrup, Lime, Peanuts, Lemon, Banana, Nutmeg, Grape, Almond, Pepper, Cinnamon, Cherry, Pear&hellip;</div>`},
      {cls:'s9',html:`<div class="label fu">Standout Moments</div><div style="margin-top:.8rem"><div class="moment-item fu d1"><div class="mdot mdot-good">&#10086;</div><div class="mbody"><div class="date">Jul 19 &middot; V60</div><div class="note good">"Orange, Lime, Sweet Aromatics, Overall Sweet." &#11088;&#11088;&#11088;&#11088;&#11088;</div><div class="detail">Raxidi Lobo &middot; 22g&rarr;331.8g &middot; 180s &middot; 92&deg;C &middot; 95 clicks &middot; last-gasp masterpiece from the bag</div></div></div><div class="moment-item fu d2"><div class="mdot mdot-good">&#10086;</div><div class="mbody"><div class="date">Aug 25&ndash;30 &middot; Five-star streak</div><div class="note good">"Hazelnut, Dark Choc, Cocoa, Vanilla, Strawberry." &#11088;&times;5</div><div class="detail">Daily Driver Bag 3 &middot; 32 clicks &middot; five consecutive 5&#9733; days &middot; Q3's longest streak</div></div></div><div class="moment-item fu d3"><div class="mdot mdot-good">&#10086;</div><div class="mbody"><div class="date">Sep 28 &middot; V60 (4:6 Method)</div><div class="note good">"Apple, Lemon." &#11088;&#11088;&#11088;&#11088;&#11088;</div><div class="detail">Brewer's Tribute Naturals &middot; 18g&rarr;270g &middot; 225s &middot; 110 clicks &middot; pour-over peak of the quarter</div></div></div><div class="moment-item fu d4"><div class="mdot mdot-bad">&#10005;</div><div class="mbody"><div class="date">Aug 30 &middot; The Shreyansh incident</div><div class="note bad">"Never letting Shreyansh grind beans again.&#128591;" &#9733;</div><div class="detail">Excelsa &middot; 35 clicks &middot; way too coarse &middot; let a friend touch the grinder exactly once</div></div></div></div>`},
      {cls:'s10',html:`<div class="label fu">K6 Clicks &mdash; Q3 Overview</div><div class="headline fu d1">From <em>chaotic dialling</em> to <span class="hi">locked precision</span></div><div class="chart-container fu d2"><canvas id="grindChart"></canvas></div><div class="sub fu d3">Jul: 28&ndash;40 &middot; Aug: 29&ndash;33 &middot; Sep: 27&ndash;37<br><span style="opacity:.4;font-size:.85rem">Espresso sessions only &middot; lower = finer</span></div>`},
      {cls:'s11',html:`<div class="label fu">Money Saved vs Caf&eacute;</div><div class="bignum fu d1" style="font-size:clamp(3rem,14vw,7rem)">&#8377;19,916</div><div class="headline fu d2">saved this quarter</div><div class="sub fu d3">Caf&eacute; equiv: <span class="hi">&#8377;24,400</span> &middot; Home cost: <span class="hi">~&#8377;4,484</span><br><span style="font-size:.8rem;opacity:.5">(87 Dedica Duo &times;&#8377;200 + 12 komp &times;&#8377;175 + 21 V60 &times;&#8377;200 + 3 KaldiPress/other &times;&#8377;150) &minus; 1,930g used beans</span><br>July &#8377;5,079 &middot; August &#8377;7,216 &middot; September &#8377;7,620<br>Savings grew every single month.</div><div class="chart-container fu d4" style="margin-top:1rem;height:150px"><canvas id="savingsChart"></canvas></div>`},
      {cls:'s12',html:`<div class="headline glow fu" style="font-size:clamp(2rem,8vw,3.2rem)">That was Q3 &#9749;</div><div class="sub fu d2" style="margin-top:1rem">123 brews &middot; 32 perfect shots &middot; 85/92 days &middot; 8 beans.<br>Kompresso held the fort. Dedica returned. August was flawless. September was wild.<br>First Robusta. Excelsa's wine chaos. Aranya Gold arrived spotless.</div><div style="margin-top:2rem;display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center" class="fu d3"><div class="pill">&#9749; 123 brews</div><div class="pill">&#128293; 85/92 days</div><div class="pill">&#11088; 32 five-stars</div><div class="pill">&#128176; &#8377;19,916 saved</div><div class="pill">&#127975; First Robusta</div><div class="pill">&#127381; Aranya Gold</div></div><a href="index.html" class="pill fu d4" style="margin-top:1.5rem;display:inline-block">&#8592; All Recaps</a>`},
    ];
    function buildDeck(){const deck=document.getElementById('deck');SLIDES.forEach(({cls,html})=>{const div=document.createElement('div');div.className=`slide ${cls}`;div.innerHTML=html;particles(div);deck.appendChild(div);});tot=SLIDES.length;const dots=document.getElementById('dots');for(let i=0;i<tot;i++){const d=document.createElement('div');d.className='dot';d.onclick=()=>goTo(i);dots.appendChild(d);}goTo(0);requestAnimationFrame(initCharts);}
    function goTo(n){const slides=document.querySelectorAll('.slide');slides[cur]?.classList.remove('active');slides[cur]?.classList.add('out');setTimeout(()=>slides[cur]?.classList.remove('out'),500);cur=n;slides[cur]?.classList.add('active');document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===cur));document.getElementById('progress').style.width=`${((cur+1)/tot*100).toFixed(1)}%`;}
    function navNext(){if(cur>=tot-1){window.location.href='index.html';}else{goTo(cur+1);}}
    function navPrev(){goTo(Math.max(cur-1,0));}
    document.getElementById('navR').onclick=navNext;
    document.getElementById('navL').onclick=navPrev;
    document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowDown')navNext();if(e.key==='ArrowLeft'||e.key==='ArrowUp')navPrev();});
    let tx=0;
    document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
    document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>50){dx<0?navNext():navPrev()}});
    function initCharts(){
      const TEXT='rgba(245,239,224,0.35)';const GRID='rgba(232,168,62,0.06)';
      Chart.defaults.font.family="'DM Sans',sans-serif";Chart.defaults.font.size=11;Chart.defaults.color=TEXT;
      const bc=document.getElementById('brewerChart');
      if(bc)new Chart(bc,{type:'bar',data:{labels:['July','August','September'],datasets:[{label:'Espresso',data:[9,38,40],backgroundColor:AMBER,borderRadius:4,stack:'a'},{label:'Kompresso',data:[12,0,0],backgroundColor:PURPLE,borderRadius:4,stack:'a'},{label:'V60',data:[8,6,7],backgroundColor:GREEN,borderRadius:4,stack:'a'},{label:'Other',data:[2,1,0],backgroundColor:'#27ae60',borderRadius:4,stack:'a'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{stacked:true,ticks:{color:TEXT},grid:{display:false}},y:{stacked:true,ticks:{color:TEXT,stepSize:10},grid:{color:GRID},min:0,max:50}}}});
      const grindLabels=['Jul 22','Jul 23','Jul 28a','Jul 28b','Jul 28c','Jul 29','Jul 30a','Jul 30b','Jul 30c','Jul 31','Aug 1','Aug 3','Aug 5','Aug 7','Aug 10','Aug 13','Aug 15','Aug 17','Aug 19','Aug 20','Aug 22','Aug 25','Aug 27','Aug 29','Aug 31','Sep 2','Sep 4','Sep 8','Sep 11','Sep 16','Sep 20','Sep 24','Sep 26','Sep 29'];
      const grindData=[30,28,30,33,31,32,35,40,32,32,32,31,31,30,31,31,30,29,29,30,33,32,33,32,30,30,31,35,31,31,28,35,33,33];
      const gc=document.getElementById('grindChart');
      if(gc)new Chart(gc,{type:'line',data:{labels:grindLabels,datasets:[{data:grindData,borderColor:AMBER,backgroundColor:'rgba(232,168,62,0.08)',pointBackgroundColor:AMBER,pointRadius:2.5,tension:0.3,fill:true,spanGaps:true}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.raw?` ${c.raw} clicks`:''}}},scales:{x:{ticks:{color:TEXT,font:{size:7},maxRotation:45,autoSkip:true,maxTicksLimit:14},grid:{display:false}},y:{ticks:{color:TEXT,callback:v=>v+' cl'},grid:{color:GRID},min:24,max:44,reverse:true}}}});
      const sc=document.getElementById('savingsChart');
      if(sc)new Chart(sc,{type:'bar',data:{labels:['July','August','September'],datasets:[{data:[5079,7216,7618],backgroundColor:[AMBER,GREEN,PURPLE],borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' \u20B9'+c.raw.toLocaleString('en-IN')}}},scales:{x:{ticks:{color:TEXT},grid:{display:false}},y:{ticks:{color:TEXT,callback:v=>'\u20B9'+(v/1000).toFixed(0)+'k'},grid:{color:GRID},min:0,max:10000}}}});
    }
    buildDeck();
  </script>
