<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Broke Barista | Log</title>
  <meta name="description" content="Your full coffee purchase history — beans, gear, and accessories.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@300;400&display=swap"
    rel="stylesheet">
  <script>
    (function() {
      var theme = localStorage.getItem('bb_theme') || 'nordic';
      var savedMode = localStorage.getItem('theme');
      var isDark = savedMode === 'dark' || (!savedMode && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', theme);
      if (isDark) document.documentElement.classList.add('dark-mode');
    })();
  </script>
  <link rel="stylesheet" href="/styles.css">
  <style>
    /* ── Log Page Header ─────────────────────────── */
    .log-header {
      max-width: 820px;
      margin: 0 auto;
      padding: 1.8rem 1.25rem .5rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .log-header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.9rem;
      font-weight: 400;
      color: var(--espresso);
      letter-spacing: -.02em;
      line-height: 1.1;
    }

    .log-header h1 em {
      color: var(--caramel);
      font-style: italic;
    }

    .log-header .sub {
      font-size: .72rem;
      color: var(--mid);
      letter-spacing: .1em;
      text-transform: uppercase;
      margin-top: .25rem;
      font-weight: 300;
    }

    .header-actions {
      display: flex;
      gap: .5rem;
      align-items: center;
    }

    .owner-btn {
      background: var(--steam);
      border: 1.5px solid var(--parchment);
      border-radius: 12px;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--caramel);
      font-size: 1.1rem;
      transition: all .3s ease;
      box-shadow: 0 2px 8px var(--shadow);
    }

    .owner-btn:hover {
      border-color: var(--caramel);
      transform: translateY(-2px);
      box-shadow: 0 4px 16px var(--shadow);
    }

    /* ── Log Hero Section ────────────────────────── */
    .log-hero {
      max-width: 820px;
      margin: 0 auto;
      padding: 0 1.25rem;
    }

    /* ── Grand Total Banner ──────────────────────── */
    .grand-total-banner {
      background: var(--steam);
      border: 1px solid var(--parchment);
      border-radius: 16px;
      padding: 1rem 1.2rem;
      margin-bottom: .85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      overflow: hidden;
      transition: transform .25s, box-shadow .25s;
    }

    .grand-total-banner:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px var(--shadow);
    }

    .grand-total-banner::before {
      content: '';
      position: absolute;
      top: -60%;
      right: -20%;
      width: 250px;
      height: 250px;
      background: radial-gradient(circle, rgba(196, 125, 42, .06) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    .gt-left {
      position: relative;
      z-index: 1;
    }

    .gt-label {
      font-size: .58rem;
      color: var(--mid);
      letter-spacing: .14em;
      text-transform: uppercase;
      font-weight: 500;
    }

    .gt-amount {
      font-family: 'Playfair Display', serif;
      font-size: 1.65rem;
      color: var(--espresso);
      line-height: 1.1;
      margin-top: .15rem;
    }

    .gt-right {
      display: flex;
      gap: .85rem;
      position: relative;
      z-index: 1;
    }

    .gt-cat {
      text-align: center;
    }

    .gt-cat-amount {
      font-family: 'Playfair Display', serif;
      font-size: .95rem;
      color: var(--espresso);
      line-height: 1.1;
    }

    .gt-cat-label {
      font-size: .52rem;
      color: var(--mid);
      letter-spacing: .1em;
      text-transform: uppercase;
      margin-top: .1rem;
      font-weight: 500;
    }

    .gt-cat.beans .gt-cat-amount { color: var(--green); }
    .gt-cat.gears .gt-cat-amount { color: var(--blue); }
    .gt-cat.acc .gt-cat-amount { color: var(--purple); }

    /* ── Spend Breakdown Bar ─────────────────────── */
    .spend-bar-wrap {
      margin-bottom: .85rem;
    }

    .spend-bar {
      height: 10px;
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      background: var(--parchment);
    }

    .spend-seg {
      height: 100%;
      transition: width .6s ease;
    }

    .spend-seg.beans {
      background: linear-gradient(90deg, var(--green), #8CC85A);
    }

    .spend-seg.gears {
      background: linear-gradient(90deg, var(--blue), #7AABDF);
    }

    .spend-seg.acc {
      background: linear-gradient(90deg, var(--purple), #B47AC4);
    }

    .spend-legend {
      display: flex;
      gap: 1rem;
      margin-top: .4rem;
      justify-content: center;
    }

    .spend-legend-item {
      display: flex;
      align-items: center;
      gap: .3rem;
      font-size: .6rem;
      color: var(--mid);
    }

    .spend-legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .spend-legend-dot.beans { background: var(--green); }
    .spend-legend-dot.gears { background: var(--blue); }
    .spend-legend-dot.acc { background: var(--purple); }

    /* ── Activity Strip ──────────────────────────── */
    .log-activity-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: .65rem;
      margin-bottom: .85rem;
    }

    .la-card {
      background: var(--steam);
      border: 1px solid var(--parchment);
      border-radius: 14px;
      padding: .75rem .6rem;
      text-align: center;
      transition: transform .25s cubic-bezier(.34, 1.56, .64, 1), box-shadow .25s;
    }

    .la-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px var(--shadow);
    }

    .la-num {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      color: var(--roast);
      line-height: 1.1;
    }

    .la-label {
      font-size: .55rem;
      color: var(--mid);
      letter-spacing: .12em;
      text-transform: uppercase;
      margin-top: .2rem;
      font-weight: 500;
    }

    /* ── Last Purchase Card ──────────────────────── */
    .last-purchase-card {
      background: var(--steam);
      border: 1px solid var(--parchment);
      border-radius: 16px;
      padding: 1rem 1.1rem;
      margin-bottom: .85rem;
      display: flex;
      gap: 1rem;
      align-items: flex-start;
      transition: transform .25s, box-shadow .25s;
      position: relative;
      overflow: hidden;
    }

    .last-purchase-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px var(--shadow);
    }

    .last-purchase-card::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -30%;
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, rgba(196, 125, 42, .04) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    .lp-left {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .2rem;
    }

    .lp-date {
      font-size: .56rem;
      color: var(--cream);
      background: var(--caramel);
      padding: .18rem .5rem;
      border-radius: 6px;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .lp-cat-badge {
      font-size: .5rem;
      padding: .14rem .4rem;
      border-radius: 5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    .lp-cat-badge.beans { background: var(--green-bg); color: var(--green); }
    .lp-cat-badge.gears { background: var(--blue-bg); color: var(--blue); }
    .lp-cat-badge.accessories { background: var(--purple-bg); color: var(--purple); }

    .lp-body {
      flex: 1;
      min-width: 0;
    }

    .lp-name {
      font-family: 'Playfair Display', serif;
      font-size: .92rem;
      color: var(--espresso);
      line-height: 1.2;
      margin-bottom: .15rem;
    }

    .lp-meta {
      font-size: .66rem;
      color: var(--mid);
      display: flex;
      flex-wrap: wrap;
      gap: .3rem .65rem;
    }

    .lp-pills {
      display: flex;
      gap: .3rem;
      flex-wrap: wrap;
      margin-top: .35rem;
    }

    .lp-pill {
      font-size: .58rem;
      background: var(--parchment);
      padding: .16rem .45rem;
      border-radius: 6px;
      color: var(--roast);
    }

    .lp-price {
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      color: var(--caramel);
      text-align: right;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
    }

    /* ── Top Vendors Mini ────────────────────────── */
    .top-vendors-card {
      background: var(--steam);
      border: 1px solid var(--parchment);
      border-radius: 16px;
      padding: .85rem 1rem;
      margin-bottom: .85rem;
      transition: transform .25s, box-shadow .25s;
    }

    .top-vendors-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px var(--shadow);
    }

    .tv-title {
      font-size: .58rem;
      color: var(--mid);
      letter-spacing: .14em;
      text-transform: uppercase;
      font-weight: 500;
      margin-bottom: .5rem;
    }

    .tv-row {
      display: flex;
      align-items: center;
      gap: .5rem;
      margin-bottom: .35rem;
    }

    .tv-label {
      font-size: .68rem;
      color: var(--espresso);
      min-width: 80px;
      text-align: right;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tv-bar-wrap {
      flex: 1;
      height: 8px;
      background: var(--parchment);
      border-radius: 4px;
      overflow: hidden;
    }

    .tv-bar {
      height: 100%;
      border-radius: 4px;
      background: linear-gradient(90deg, var(--caramel), var(--honey));
      transition: width .5s ease;
    }

    .tv-amount {
      font-size: .58rem;
      color: var(--light);
      min-width: 45px;
      font-family: 'DM Mono', monospace;
      text-align: right;
    }

    /* ── Section Dividers ─────────────────────────── */
    .hero-divider {
      display: flex;
      align-items: center;
      gap: .65rem;
      margin: .4rem 0 .6rem;
    }

    .hero-divider .label {
      font-size: .58rem;
      color: var(--mid);
      letter-spacing: .14em;
      text-transform: uppercase;
      font-weight: 500;
      flex-shrink: 0;
    }

    .hero-divider .line {
      flex: 1;
      height: 1px;
      background: var(--parchment);
    }

    /* ── Card Hover Polish ────────────────────────── */
    .stat-card {
      transition: transform .25s cubic-bezier(.34, 1.56, .64, 1), box-shadow .25s;
    }

    .stat-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px var(--shadow);
    }

    .solo-card,
    .entry-card {
      transition: transform .25s cubic-bezier(.34, 1.56, .64, 1), box-shadow .25s;
    }

    .solo-card:hover,
    .entry-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 28px var(--shadow);
    }

    .order-group {
      transition: transform .25s, box-shadow .25s;
    }

    .order-group:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px var(--shadow);
    }

    /* ── Action Buttons Fade ─────────────────────── */
    .entry-right .action-btn {
      opacity: .5;
      transition: all .25s;
    }

    .solo-card:hover .action-btn,
    .entry-card:hover .action-btn {
      opacity: 1;
    }

    .action-btn:hover {
      transform: translateY(-1px);
    }

    /* ── Filter Bar Polish ────────────────────────── */
    .filter-btn {
      transition: all .25s;
    }

    .filter-btn:hover:not(.active) {
      background: var(--parchment);
      transform: translateY(-1px);
    }

    /* ── Entry Date Badge ─────────────────────────── */
    .entry-date {
      background: rgba(196, 125, 42, .08);
      padding: .1rem .4rem;
      border-radius: 5px;
      color: var(--caramel);
      font-weight: 500;
    }

    /* ── Entrance Animations ──────────────────────── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .anim-in { animation: fadeUp .4s both; }
    .anim-d1 { animation-delay: .05s; }
    .anim-d2 { animation-delay: .1s; }
    .anim-d3 { animation-delay: .15s; }
    .anim-d4 { animation-delay: .2s; }
    .anim-d5 { animation-delay: .25s; }
    .anim-d6 { animation-delay: .3s; }

    /* ── Add Entry CTA ───────────────────────────── */
    .add-entry-btn {
      background: linear-gradient(135deg, var(--caramel), var(--honey));
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: .55rem 1rem;
      font-size: .78rem;
      font-weight: 600;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      transition: all .25s;
      box-shadow: 0 2px 12px rgba(196, 125, 42, .3);
      display: flex;
      align-items: center;
      gap: .3rem;
      text-decoration: none;
    }

    .add-entry-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(196, 125, 42, .4);
      color: #fff;
    }

    @media (max-width: 480px) {
      .log-header { padding: 1.5rem 1rem .5rem; }
      .log-hero { padding: 0 1rem; }
      .log-activity-strip { grid-template-columns: repeat(2, 1fr); }
      .gt-right { gap: .5rem; }
      .gt-cat-amount { font-size: .8rem; }
    }
  </style>
</head>

<body data-page="log">

  <!-- OWNER LOGIN MODAL -->
  <div id="pin-overlay" onclick="maybeHidePinModal(event)">
    <div class="pin-card" style="position:relative">
      <button class="pin-close-btn" onclick="hidePinModal()">✕</button>
      <div class="pin-logo">☕</div>
      <h2 class="pin-title">Broke <em>Barista</em></h2>
      <p class="pin-sub">Enter owner PIN</p>
      <div class="pin-dots" id="pinDots">
        <div class="pin-dot" id="d0"></div>
        <div class="pin-dot" id="d1"></div>
        <div class="pin-dot" id="d2"></div>
        <div class="pin-dot" id="d3"></div>
      </div>
      <div class="pin-keypad">
        <button class="pin-key" onclick="pinPress('1')">1</button>
        <button class="pin-key" onclick="pinPress('2')">2</button>
        <button class="pin-key" onclick="pinPress('3')">3</button>
        <button class="pin-key" onclick="pinPress('4')">4</button>
        <button class="pin-key" onclick="pinPress('5')">5</button>
        <button class="pin-key" onclick="pinPress('6')">6</button>
        <button class="pin-key" onclick="pinPress('7')">7</button>
        <button class="pin-key" onclick="pinPress('8')">8</button>
        <button class="pin-key" onclick="pinPress('9')">9</button>
        <button class="pin-key pin-blank" disabled></button>
        <button class="pin-key" onclick="pinPress('0')">0</button>
        <button class="pin-key pin-del" onclick="pinDel()">⌫</button>
      </div>
      <p class="pin-error-msg" id="pinErr"></p>
    </div>
  </div>

  <!-- HEADER -->
  <div class="page-header log-header">
    <div>
      <h1>Purchase <em>Log</em></h1>
      <div class="sub">Beans · gear · accessories</div>
    </div>
    <div class="header-actions">
      <button class="theme-toggle" onclick="toggleTheme()" title="Toggle Dark/Light Mode">🌓</button>
      <button class="owner-btn" onclick="toggleOwnerAccess()" title="Owner Login">🔐</button>
      <a href="/add" class="add-entry-btn">+ Add Entry</a>
    </div>
  </div>

  <!-- ═══════════════ LOG HERO ═══════════════ -->
  <div class="log-hero" id="log-hero">
    <!-- Grand Total Banner -->
    <div id="lh-grand-total" class="anim-in"></div>

    <!-- Spend Breakdown Bar -->
    <div id="lh-spend-bar" class="anim-in anim-d1"></div>

    <!-- Activity Strip -->
    <div class="log-activity-strip anim-in anim-d2" id="lh-activity-strip">
      <div class="la-card">
        <div class="la-num" id="lh-entries">—</div>
        <div class="la-label">Entries</div>
      </div>
      <div class="la-card">
        <div class="la-num" id="lh-beans-count">—</div>
        <div class="la-label">Bags Bought</div>
      </div>
      <div class="la-card">
        <div class="la-num" id="lh-avg-price">—</div>
        <div class="la-label">Avg / Bag</div>
      </div>
      <div class="la-card">
        <div class="la-num" id="lh-this-month">—</div>
        <div class="la-label">This Month</div>
      </div>
    </div>

    <!-- Last Purchase -->
    <div class="hero-divider anim-in anim-d3">
      <span class="label">🛒 Last Purchase</span>
      <span class="line"></span>
    </div>
    <div id="lh-last-purchase" class="anim-in anim-d4"></div>

    <!-- Top Vendors -->
    <div id="lh-top-vendors" class="anim-in anim-d5"></div>
  </div>

  <!-- ═══════════════ LOG CONTENT ═══════════════ -->
  <div class="page-content">
    <div class="stat-strip anim-in anim-d1" id="logStatStrip">
      <div class="stat-card">
        <div class="stat-num" id="statBeans">₹0</div>
        <div class="stat-label">Beans</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statGears">₹0</div>
        <div class="stat-label">Gears</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statAcc">₹0</div>
        <div class="stat-label">Accessories</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statCount">0</div>
        <div class="stat-label">Entries</div>
      </div>
    </div>
    <div class="filter-bar anim-in anim-d2">
      <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
      <button class="filter-btn" onclick="setFilter('beans',this)">Beans</button>
      <button class="filter-btn" onclick="setFilter('gears',this)">Gears</button>
      <button class="filter-btn" onclick="setFilter('accessories',this)">Accessories</button>
    </div>
    <div id="entriesList" class="anim-in anim-d3"></div>
  </div>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <a href="/log" class="nav-link" data-page="log"><span class="nav-icon">📋</span><span
        class="nav-label">Log</span></a>
    <a href="/shelf" class="nav-link" data-page="shelf"><span class="nav-icon">🫙</span><span
        class="nav-label">Shelf</span></a>
    <a href="/" class="nav-link" data-page="insights"><span class="nav-icon">📊</span><span
        class="nav-label">Stats</span></a>
    <a href="/recap" class="nav-link" data-page="recap"><span class="nav-icon">🎞️</span><span
        class="nav-label">Recap</span></a>
    <a href="/journal" class="nav-link" data-page="journal"><span class="nav-icon">📓</span><span
        class="nav-label">Journal</span></a>
    <a href="/add" class="nav-link" data-page="add"><span class="nav-icon">＋</span><span
        class="nav-label">Add</span></a>
  </nav>

  <script src="/app.js"></script>
  <script>
    /* ═══════════════════════════════════════════════════════
       LOG HERO — hooks into renderAll lifecycle
    ═══════════════════════════════════════════════════════ */
    (function () {
      const _origRender = window.renderAll;
      window.renderAll = function () {
        _origRender.apply(this, arguments);
        renderLogHero();
      };

      function esc(s) {
        const d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
      }

      function fmtMoney(n) {
        return '₹' + Number(n).toLocaleString('en-IN', { maximumFractionDigits: 0 });
      }

      function renderLogHero() {
        if (!logs || !logs.length) {
          document.getElementById('log-hero').style.display = 'none';
          return;
        }
        document.getElementById('log-hero').style.display = '';

        const beans = logs.filter(l => l.category === 'beans');
        const gears = logs.filter(l => l.category === 'gears');
        const acc = logs.filter(l => l.category === 'accessories');
        const beansSpend = beans.reduce((s, l) => s + Number(l.price || 0), 0);
        const gearsSpend = gears.reduce((s, l) => s + Number(l.price || 0), 0);
        const accSpend = acc.reduce((s, l) => s + Number(l.price || 0), 0);
        const totalSpend = beansSpend + gearsSpend + accSpend;

        // ── Grand Total Banner ──
        document.getElementById('lh-grand-total').innerHTML = `
          <div class="grand-total-banner">
            <div class="gt-left">
              <div class="gt-label">Total Invested</div>
              <div class="gt-amount">${fmtMoney(totalSpend)}</div>
            </div>
            <div class="gt-right">
              <div class="gt-cat beans">
                <div class="gt-cat-amount">${fmtMoney(beansSpend)}</div>
                <div class="gt-cat-label">Beans</div>
              </div>
              <div class="gt-cat gears">
                <div class="gt-cat-amount">${fmtMoney(gearsSpend)}</div>
                <div class="gt-cat-label">Gear</div>
              </div>
              <div class="gt-cat acc">
                <div class="gt-cat-amount">${fmtMoney(accSpend)}</div>
                <div class="gt-cat-label">Acc</div>
              </div>
            </div>
          </div>`;

        // ── Spend Bar ──
        const bPct = totalSpend > 0 ? (beansSpend / totalSpend * 100) : 0;
        const gPct = totalSpend > 0 ? (gearsSpend / totalSpend * 100) : 0;
        const aPct = totalSpend > 0 ? (accSpend / totalSpend * 100) : 0;
        document.getElementById('lh-spend-bar').innerHTML = `
          <div class="spend-bar-wrap">
            <div class="spend-bar">
              <div class="spend-seg beans" style="width:${bPct}%"></div>
              <div class="spend-seg gears" style="width:${gPct}%"></div>
              <div class="spend-seg acc" style="width:${aPct}%"></div>
            </div>
            <div class="spend-legend">
              <span class="spend-legend-item"><span class="spend-legend-dot beans"></span> Beans ${Math.round(bPct)}%</span>
              <span class="spend-legend-item"><span class="spend-legend-dot gears"></span> Gear ${Math.round(gPct)}%</span>
              <span class="spend-legend-item"><span class="spend-legend-dot acc"></span> Acc ${Math.round(aPct)}%</span>
            </div>
          </div>`;

        // ── Activity Strip ──
        const avgBagPrice = beans.length > 0
          ? fmtMoney(beans.reduce((s, l) => s + Number(l.price || 0), 0) / beans.length)
          : '—';
        const now = new Date();
        const thisYM = now.toISOString().slice(0, 7);
        const thisMonthSpend = logs.filter(l => l.date.slice(0, 7) === thisYM).reduce((s, l) => s + Number(l.price || 0), 0);

        document.getElementById('lh-entries').textContent = logs.length;
        document.getElementById('lh-beans-count').textContent = beans.length;
        document.getElementById('lh-avg-price').textContent = avgBagPrice;
        document.getElementById('lh-this-month').textContent = fmtMoney(thisMonthSpend);

        // ── Last Purchase ──
        const lastPurchaseEl = document.getElementById('lh-last-purchase');
        const sorted = [...logs].sort((a, b) => new Date(b.date) - new Date(a.date));
        const last = sorted[0];
        if (last) {
          const d = new Date(last.date + 'T00:00:00');
          const dateLabel = d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
          const pills = [];
          if (last.origin && last.category === 'beans') pills.push(`📍 ${esc(last.origin)}`);
          if (last.roaster && last.category === 'beans') pills.push(esc(last.roaster));
          if (last.size) pills.push(esc(last.size));

          lastPurchaseEl.innerHTML = `
            <div class="last-purchase-card">
              <div class="lp-left">
                <span class="lp-date">${dateLabel}</span>
                <span class="lp-cat-badge ${last.category}">${last.category === 'beans' ? 'Beans' : last.category === 'gears' ? 'Gear' : 'Acc'}</span>
              </div>
              <div class="lp-body">
                <div class="lp-name">${esc(last.name)}</div>
                <div class="lp-meta">
                  <span>${esc(last.vendor)}</span>
                </div>
                ${pills.length ? `<div class="lp-pills">${pills.map(p => `<span class="lp-pill">${p}</span>`).join('')}</div>` : ''}
              </div>
              <div class="lp-price">${last.is_gift ? '🎁' : fmtMoney(last.price)}</div>
            </div>`;
        } else {
          lastPurchaseEl.innerHTML = '';
        }

        // ── Top Vendors ──
        const vendorEl = document.getElementById('lh-top-vendors');
        const vendorSpend = {};
        logs.forEach(l => {
          const v = l.vendor || 'Unknown';
          vendorSpend[v] = (vendorSpend[v] || 0) + Number(l.price || 0);
        });
        const sortedVendors = Object.entries(vendorSpend).sort((a, b) => b[1] - a[1]);
        if (sortedVendors.length > 1) {
          const maxV = sortedVendors[0][1];
          const rows = sortedVendors.slice(0, 5).map(([vendor, amount]) => {
            const pct = Math.round(amount / maxV * 100);
            return `<div class="tv-row">
              <span class="tv-label">${esc(vendor)}</span>
              <div class="tv-bar-wrap"><div class="tv-bar" style="width:${pct}%"></div></div>
              <span class="tv-amount">${fmtMoney(amount)}</span>
            </div>`;
          }).join('');
          vendorEl.innerHTML = `
            <div class="top-vendors-card">
              <div class="tv-title">🏪 Top Vendors</div>
              ${rows}
            </div>`;
        } else {
          vendorEl.innerHTML = '';
        }
      }
    })();
  </script>
</body>

</html>
